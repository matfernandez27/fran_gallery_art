<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Página no encontrada | Francisco Fernández</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Sin dependencias externas de estilos: esta página debe verse bien aunque falle todo lo demás. */
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
               background: #faf9f7; color: #14151a; font-family: 'Inter', system-ui, Arial, sans-serif; }
        main { max-width: 420px; text-align: center; }
        .code { font-family: 'Playfair Display', Georgia, serif; font-size: 5rem; line-height: 1; color: #2563eb; margin: 0 0 8px; }
        h1 { font-family: 'Playfair Display', Georgia, serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 12px; }
        p { color: #4f5766; line-height: 1.6; margin: 0 0 28px; font-size: 0.95rem; }
        a { display: inline-block; background: #14151a; color: #fff; text-decoration: none; padding: 12px 28px;
            border-radius: 2px; font-size: 0.875rem; font-weight: 500; transition: background-color .2s; }
        a:hover { background: #000; }
        a:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">404</p>
        <h1>Página no encontrada</h1>
        <p>La dirección que buscás no existe o fue movida. Podés volver a la galería y seguir recorriendo las obras.</p>
        <a href="/index.html">Volver a la galería</a>
    </main>
</body>
</html>
